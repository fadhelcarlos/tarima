<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d0b0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Baqueta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Instrument+Sans:wght@400..600&display=swap" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Batería 3D"></canvas>
      <div id="labels" aria-hidden="true"></div>
      <div id="hud"></div>
      <div id="loader">
        <div class="loader-card">
          <h1 class="wordmark">Baqueta</h1>
          <p class="tagline">Una batería acústica real para tocar con los dedos.</p>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <p class="step" id="loader-step">Preparando la sala</p>
          <button id="start" class="primary" type="button" hidden>Tocar</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
